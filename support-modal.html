<div class="modal fade" id="supportAjaxModal" tabindex="-1" aria-labelledby="supportAjaxModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title fs-5" id="supportAjaxModalLabel">مساعدة سريعة</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="إغلاق"></button>
            </div>
            <div class="modal-body">
                <p>اترك بياناتك وسيقوم فريق الدعم بالتواصل معك لمساعدتك في اختيار الحل المناسب.</p>
                <form id="supportAjaxForm">
                    <div class="mb-3">
                        <label for="supportName" class="form-label">الاسم</label>
                        <input type="text" class="form-control" id="supportName" required>
                    </div>
                    <div class="mb-3">
                        <label for="supportEmail" class="form-label">البريد الإلكتروني</label>
                        <input type="email" class="form-control" id="supportEmail" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">إرسال طلب التواصل</button>
                </form>
            </div>
        </div>
    </div>
</div>
